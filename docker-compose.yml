---
services:
  postgres:
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: legifrss
      POSTGRES_USER: legifrss
      POSTGRES_DB: legifrss
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U legifrss
      interval: 5s
      timeout: 5s
      retries: 5
