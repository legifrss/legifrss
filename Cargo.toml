[package]
name = "legifrss"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13.5"
actix-web = { version = "4.14.0", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures = "0.3.32"
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.13.4", features = ["blocking", "form", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "rust_decimal", "uuid", "chrono"] }
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
